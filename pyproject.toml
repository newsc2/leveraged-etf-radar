[project]
name = "leveraged-etf-radar"
version = "0.1.0"
description = "Static dashboard tracking the U.S.-listed leveraged equity ETF/ETN universe — deployed to newsc2.com"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "plotly>=5.18",
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.5",
    "ruff>=0.1",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/html.py" = ["E501"]  # Long inline CSS / Google Fonts URLs in HTML template
